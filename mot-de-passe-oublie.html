<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Berlly Boutique</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <h1>Berlly Boutique</h1>
                <p>Récupération du compte</p>
            </div>

            <h2>Mot de passe oublié</h2>

            <p class="description">
                Saisissez l'adresse e-mail de votre compte. Si elle existe, nous vous enverrons
                un lien (valable 30 minutes) pour choisir un nouveau mot de passe.
            </p>

            <form id="forgot-form">

                <div class="form-group">
                    <label for="forgot-email">Adresse e-mail</label>
                    <input type="email" id="forgot-email" placeholder="Votre adresse e-mail" autocomplete="email" required>
                </div>

                <button type="submit" class="auth-btn">Envoyer le lien</button>

            </form>

            <p class="auth-message" id="forgot-message"></p>

            <div class="auth-footer">
                <p>
                    <a href="connexion.html">← Retour à la connexion</a>
                </p>
            </div>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
