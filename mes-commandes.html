<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mes commandes - Berlly Boutique</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="orders-container">

    <div class="orders-header">

        <div>
            <h1>Berlly Boutique</h1>
            <p>Historique de mes commandes</p>
        </div>

        <div class="orders-links">
            <a href="profil.html">👤 Mon profil</a>
            <a href="index.html">🏠 Boutique</a>
        </div>

    </div>


    <div class="orders-card">

        <div class="orders-title">

            <h2>📦 Mes commandes</h2>

            <button
                type="button"
                class="refresh-btn"
                onclick="renderMyOrders()"
            >
                🔄 Actualiser
            </button>

        </div>


        <div id="my-orders">

            <p class="loading">
                Chargement de vos commandes...
            </p>

        </div>

    </div>

</div>


<!-- Fenêtre détails commande -->

<div
    id="order-modal"
    class="order-modal"
>

    <div class="order-modal-content">

        <button
            type="button"
            class="close-modal"
            onclick="closeOrderModal()"
        >
            ×
        </button>

        <h2>Détails de la commande</h2>

        <div id="order-details"></div>

    </div>

</div>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>

/* =====================================================
   MES COMMANDES - BERLLY BOUTIQUE
   ===================================================== */

let loadedOrders = [];

/* ---------- Protection contre l'injection HTML ---------- */

function esc(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


/* ---------- Récupérer l'utilisateur connecté ---------- */

function getCurrentUser() {
    return API.getUser();
}


/* ---------- Formater le prix ---------- */

function formatOrderPrice(amount) {

    return Math.round(amount)
        .toLocaleString('fr-FR') + ' FBu';

}


/* ---------- Formater la date ---------- */

function formatOrderDate(date) {

    const orderDate = new Date(date);

    return orderDate.toLocaleDateString(
        'fr-FR',
        {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        }
    );
}


/* ---------- Afficher le statut ---------- */

function getStatusClass(status) {

    if (status === 'Confirmée') {
        return 'status-confirmed';
    }

    if (status === 'Annulée') {
        return 'status-cancelled';
    }

    if (status === 'Expédiée') {
        return 'status-shipped';
    }

    if (status === 'Livrée') {
        return 'status-delivered';
    }

    return 'status-pending';
}


/* ---------- Afficher les commandes ---------- */

async function renderMyOrders() {

    const container =
        document.getElementById('my-orders');

    if (!container) return;


    const user = getCurrentUser();


    /* Vérifier la connexion */

    if (!user) {

        container.innerHTML = `
            <div class="empty-orders">

                <h3>🔐 Connexion nécessaire</h3>

                <p>
                    Vous devez être connecté pour voir
                    vos commandes.
                </p>

                <a
                    href="connexion.html"
                    class="auth-btn"
                >
                    Se connecter
                </a>

            </div>
        `;

        return;
    }


    /* Récupérer MES commandes sur le serveur */
    container.innerHTML = '<p class="loading">Chargement de vos commandes...</p>';

    let myOrders;

    try {
        myOrders = await API.myOrders();
    } catch (error) {
        if (error.status === 401) {
            window.location.href = 'connexion.html';
            return;
        }
        container.innerHTML =
            '<div class="empty-orders"><h3>Chargement impossible</h3><p>' +
            esc(error.message) + '</p></div>';
        return;
    }

    loadedOrders = myOrders;

    /* Aucune commande */

    if (myOrders.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    🛍️
                </div>

                <h3>
                    Vous n'avez pas encore passé
                    de commande.
                </h3>

                <p>
                    Découvrez nos produits et passez
                    votre première commande.
                </p>

                <a
                    href="produits.html"
                    class="auth-btn"
                >
                    Voir les produits
                </a>

            </div>

        `;

        return;
    }


    /* Trier les commandes : plus récente en premier */

    myOrders.sort(
        (a, b) =>
            new Date(b.date) -
            new Date(a.date)
    );


    /* Afficher les commandes */

    container.innerHTML =
        myOrders.map(order => `

            <div class="order-card">

                <div class="order-card-header">

                    <div>

                        <h3>
                            ${esc(order.id)}
                        </h3>

                        <p>
                            ${formatOrderDate(order.date)}
                        </p>

                    </div>

                    <span
                        class="order-status ${getStatusClass(order.status)}"
                    >
                        ${esc(order.status || 'En attente')}
                    </span>

                </div>


                <div class="order-products">

                    ${
                        (order.cart || [])
                        .map(item => `

                            <div class="order-product">

                                <img
                                    src="${esc(item.image)}"
                                    alt="${esc(item.name)}"
                                >

                                <div>

                                    <strong>
                                        ${esc(item.name)}
                                    </strong>

                                    <p>
                                        Quantité :
                                        ${item.quantity}
                                    </p>

                                </div>

                                <span>
                                    ${formatOrderPrice(
                                        item.price *
                                        item.quantity
                                    )}
                                </span>

                            </div>

                        `)
                        .join('')
                    }

                </div>


                <div class="order-card-footer">

                    <strong>
                        Total :
                        ${formatOrderPrice(order.total)}
                    </strong>

                    <button
                        type="button"
                        onclick="showOrderDetails('${esc(order.id)}')"
                    >
                        Voir les détails
                    </button>

                </div>

            </div>

        `)
        .join('');

}


/* =====================================================
   DÉTAILS D'UNE COMMANDE
   ===================================================== */

function showOrderDetails(orderId) {
    const order =
        loadedOrders.find(
            item => item.id === orderId
        );
    if (!order) return;
    const details =
        document.getElementById('order-details');


    details.innerHTML = `

        <div class="details-section">

            <h3>Commande</h3>

            <p>
                <strong>Numéro :</strong>
                ${esc(order.id)}
            </p>

            <p>
                <strong>Date :</strong>
                ${formatOrderDate(order.date)}
            </p>

            <p>
                <strong>Statut :</strong>
                ${esc(order.status || 'En attente')}
            </p>

        </div>


        <div class="details-section">

            <h3>Produits</h3>

            ${
                (order.cart || [])
                .map(item => `

                    <div class="detail-product">

                        <span>
                            ${esc(item.name)}
                            × ${item.quantity}
                        </span>

                        <strong>
                            ${formatOrderPrice(
                                item.price *
                                item.quantity
                            )}
                        </strong>

                    </div>

                `)
                .join('')
            }

        </div>


        <div class="details-section">

            <h3>Paiement</h3>

            <p>
                <strong>Mode :</strong>
                ${esc(order.payment || 'Non indiqué')}
            </p>

            ${
                order.transactionRef
                ? `
                    <p>
                        <strong>
                            Référence :
                        </strong>

                        ${esc(order.transactionRef)}
                    </p>
                `
                : ''
            }

        </div>


        <div class="details-total">

            Total :
            ${formatOrderPrice(order.total)}

        </div>

    `;


    document
        .getElementById('order-modal')
        .classList.add('show');
}


/* =====================================================
   FERMER LA FENÊTRE
   ===================================================== */

function closeOrderModal() {

    document
        .getElementById('order-modal')
        .classList.remove('show');

}


/* Fermer en cliquant à l'extérieur */

document.addEventListener(
    'click',
    function(event) {

        const modal =
            document.getElementById('order-modal');

        if (
            event.target === modal
        ) {

            closeOrderModal();

        }

    }
);


/* =====================================================
   INITIALISATION
   ===================================================== */

document.addEventListener(
    'DOMContentLoaded',
    function() {

        renderMyOrders();

    }
);

</script>

</body>
</html>
